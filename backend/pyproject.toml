[project]
name = "smart-room-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
    "fastapi>=0.129.0",
    "httpx>=0.24.0",
    "numpy>=2.0.0,<2.3.0",
    "opencv-python>=4.12.0.88",
    "pyside6>=6.10.2",
    "pyyaml>=6.0",
    "Pillow>=11.0.0",
    "sam-2",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.40.0",
    "uvicorn[standard]>=0.40.0",
    "websocket-client>=1.8.0",
    "websockets>=16.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quest3server*"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
sam-2 = { git = "https://github.com/facebookresearch/segment-anything-2.git", branch = "sam2.1" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[project.scripts]
quest3server = "quest3server.run_dashboard:main"
