[project]
name = "smart-room-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.8.0",
    "fastapi>=0.129.0",
    "httpx>=0.24.0",
    "numpy>=2.3.0",
    "opencv-python>=4.12.0.88",
    "paho-mqtt>=2.1.0",
    "pyside6>=6.10.2",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.40.0",
    "websocket-client>=1.8.0",
    "websockets>=16.0",
]

[project.scripts]
quest3server = "quest3server.run_dashboard:main"
ha-client = "ha_client.main:main"
